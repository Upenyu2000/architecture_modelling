name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - agent/android-mobile-app
    tags:
      - 'android-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type check generated mobile runtime
        run: npm run typecheck

      - name: Run Android architecture checks
        run: npm run test:mobile

      - name: Generate Capacitor Android project
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Stage APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/Roomify-Studio-Android-2.1.0-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Roomify-Studio-Android-APK
          path: release-android/*.apk
          if-no-files-found: error

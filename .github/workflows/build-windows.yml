name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate Python and Blender scripts
        run: python -m compileall -q backend training
      - name: Install Node dependencies
        run: npm install
      - name: Type check
        shell: pwsh
        run: |
          $Output = npm run typecheck 2>&1
          $ExitCode = $LASTEXITCODE
          $Output | Tee-Object -FilePath typecheck.log
          exit $ExitCode
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TypeScript-Diagnostics
          path: typecheck.log
          if-no-files-found: warn
      - name: Build installer
        shell: pwsh
        run: |
          $Output = npm run dist:windows 2>&1
          $ExitCode = $LASTEXITCODE
          $Output | Tee-Object -FilePath windows-build.log
          exit $ExitCode
      - name: Upload Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Diagnostics
          path: windows-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Dream-Home-Visualizer-Windows
          path: release/*.exe
          if-no-files-found: error
